[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "pybind11>=2.10.0",
    "numpy>=1.18.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "mmu"
version = "0.2.0rc0"
description = "Fast binary classification metrics with uncertainty quantification"
readme = "README.rst"
requires-python = ">=3.9"
authors = [
    { name = "Ralph Urlus", email = "rurlus.dev@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.18.0",
    "scipy>=1.4.1",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
]
viz = [
    "matplotlib>=3.0",
]
all = [
    "mmu[test,viz]",
]

[project.urls]
Homepage = "https://github.com/RUrlus/ModelMetricUncertainty"

[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/mmu"]

sdist.include = [
    "src/mmu",
    "src/mmu_core",
    "CMakeLists.txt",
    "tests",
]

[tool.scikit-build.cmake.define]
MMU_CPP_STANDARD = "17"
MMU_DEV_MODE = "OFF"
MMU_ENABLE_DEBUG = "OFF"
MMU_CICD_MODE = "OFF"
MMU_ENABLE_OPENMP = "OFF"
MMU_DISABLE_OPENMP = "OFF"
MMU_VENDOR_OPENMP = "OFF"
MMU_ENABLE_INTERNAL_TESTS = "OFF"
MMU_ENABLE_ARCH_FLAGS = "ON"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -vv"
testpaths = ["tests"]
