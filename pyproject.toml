[build-system]
requires = [
    "scikit-build-core>=0.12.2",
    "pybind11>=2.10.0",
    "numpy>=2.0.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "mmu"
version = "0.2.0rc4"
description = "Fast binary classification metrics with uncertainty quantification"
readme = "README.rst"
requires-python = ">=3.10"
authors = [
    { name = "Ralph Urlus", email = "rurlus.dev@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0.2",
    "scipy>=1.5.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.6.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2",
]

all = [
    "mmu[test,viz]",
]

[project.urls]
Homepage = "https://github.com/RUrlus/ModelMetricUncertainty"

[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/mmu"]

sdist.include = [
    "src/mmu",
    "src/mmu_core",
    "CMakeLists.txt",
    "tests",
]

[tool.scikit-build.cmake.define]
MMU_CPP_STANDARD = "17"
MMU_DEV_MODE = "OFF"
MMU_ENABLE_DEBUG = "OFF"
MMU_CICD_MODE = "OFF"
MMU_ENABLE_OPENMP = "OFF"
MMU_DISABLE_OPENMP = "OFF"
MMU_VENDOR_OPENMP = "OFF"
MMU_ENABLE_INTERNAL_TESTS = "OFF"
MMU_ENABLE_ARCH_FLAGS = "ON"

[tool.cibuildwheel]
archs = ["auto64"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_x86_64"]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]

# make sure to build generic wheels
environment = {CMAKE_ARGS="-DMMU_ENABLE_ARCH_FLAGS=OFF -DMMU_DISABLE_OPENMP=ON"}

# Run pytest to ensure that the package was correctly built
test-command = "pytest {project}/tests"
test-requires = "pytest"
# Skip trying to test arm64 builds on Intel Macs
test-skip = "*-macosx_arm64 *-macosx_universal2:arm64"

# Necessary to see build output from the actual compilation
build-verbosity = 1

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# Needed for full C++17 support
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} --exclude libomp.dylib"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.ruff]
extend-select = [
    "E", # pyflakes `E`
    "W", # pyflakes `W`
    "I", # isort
    "TID", # flake8-tidy-imports
    "UP", # pyupgrade
    "D212", # pydocstyle
    "D411", # pydocstyle
    "C4",  # flake8-comprehensions
    "EM", # flake8-errmsg
    "FA", # flake8-future-annotations
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TD002", # flake8-todos
    "PL", # pylint
    "PERF", # perflint
    "FURB", # refurb
]
target-version = "py310"
line-length = 120
select = [
  # Enable Pyflakes `E`, `F` and `W` codes
  "F",
  # pytest
  "PT",
  # numpy
  "NPY",
  # import conventions
  "ICN",
  # prints
  "T20",
  # quotes
  "Q",
  # ruff-specific rules
  "RUF",
  # logging format
  "G",
  # pydocstyle
  "D",
  # annotation with autofix
  "ANN204",
  # error messages
  "EM",
  # raise
  "RSE",
  # flynt
  "FLY",
]

ignore = [
  "E501", # line length
  "PLR0913", # too many arguments
  "PLR2004", # magic value
  "PLR0912", # too many branches
  "PLR0915", # too many statements
  "PLR0911", # too many return statements
  "PLR6301", # method could be function/staticmethod
  # Only lint existing docstrings
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  # period not required
  "D400",
  "D415",
  # newline not required
  "D205",
  # address later
  "PLW2901",
  "PLC1901"
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "CPY001", "ANN001"]
"docs/sphinx/source/conf.py" = ["INP", "CPY001"]
"example.py" = ["T201", "CPY001"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -vv"
testpaths = ["tests"]
