name: Non-vendored Build and Publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-sdist
        path: dist/*.tar.gz

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - uses: pypa/cibuildwheel@v4.0.0
      env:
        CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
        CIBW_TEST_EXTRAS: test
        CIBW_TEST_COMMAND: pytest {project}/tests/api
        CIBW_ENVIRONMENT: CMAKE_ARGS="-DMMU_ENABLE_ARCH_FLAGS=OFF -DMMU_DISABLE_OPENMP=ON -DMMU_CICD_MODE=ON"
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=12.0 CMAKE_ARGS="-DMMU_ENABLE_ARCH_FLAGS=OFF -DMMU_DISABLE_OPENMP=ON -DMMU_CICD_MODE=ON"

    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: artifact-${{ matrix.os }}
        path: wheelhouse/*.whl

  upload_all:
    name: Collect artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: artifact-*
        merge-multiple: true
        path: dist

